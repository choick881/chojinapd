<link rel="preconnect" href="https://cdn.jsdelivr.net">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
  /* 방향: 절제된 에디토리얼 — 따뜻한 오프화이트 + 잉크 + 딥그린 악센트 1색 */
  :root {
    --bg: #f5f3ee;
    --paper: #fffdf8;
    --ink: #17191e;
    --muted: #5a5f6b;
    --line: #d9d5cb;
    --line-strong: #17191e;
    --accent: #0b6b4c;
    --accent-soft: #dcefe6;
    --accent-ink: #ffffff;
    --pending: #8a5300;
    --pending-soft: #fbeccd;
    --danger: #a3261b;
    --danger-soft: #f8e1dd;
    --busy: #e7e3da;
    --radius: 6px;
    --font: 'Pretendard Variable', Pretendard, 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0; background: var(--bg); color: var(--ink); font-family: var(--font);
    font-size: 16px; line-height: 1.65; word-break: keep-all; overflow-wrap: break-word;
  }
  h1, h2, h3 { word-break: keep-all; line-height: 1.25; margin: 0; }
  a { color: var(--accent); }
  button, input, select, textarea { font: inherit; color: inherit; }
  :focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
  .wrap { max-width: 760px; margin: 0 auto; padding: 0 16px 140px; }
  .wrap.wide { max-width: 1180px; }

  /* 머리 */
  .top { padding: 28px 0 18px; border-bottom: 2px solid var(--line-strong); margin-bottom: 8px; }
  .eyebrow { font-size: 13px; font-weight: 700; letter-spacing: .08em; color: var(--accent); text-transform: uppercase; }
  .top h1 { font-size: clamp(1.9rem, 6vw, 2.6rem); font-weight: 850; letter-spacing: -0.03em; margin-top: 6px; }
  .top .who { margin-top: 8px; color: var(--muted); font-size: 14px; }
  .top .intro { margin: 8px 0 0; max-width: 46em; }
  .tabs { display: flex; gap: 4px; margin: 14px 0 0; flex-wrap: wrap; }
  .tab { border: 1px solid var(--line-strong); background: transparent; padding: 8px 16px; border-radius: 999px;
    font-weight: 650; cursor: pointer; font-size: 15px; }
  a.tab { color: var(--ink); text-decoration: none; }
  .tab[aria-selected="true"] { background: var(--ink); color: var(--paper); }
  .tab .n { display: inline-block; min-width: 1.4em; margin-left: 4px; padding: 0 6px; border-radius: 999px;
    background: var(--pending-soft); color: var(--pending); font-size: 12px; }

  /* 단계 */
  .step { padding: 26px 0 22px; border-bottom: 1px solid var(--line); }
  .step-h { display: flex; align-items: baseline; gap: 12px; margin-bottom: 14px; }
  .step-no { font-variant-numeric: tabular-nums; font-weight: 800; color: var(--accent); font-size: 14px; }
  .step-h h2 { font-size: 1.25rem; font-weight: 800; letter-spacing: -0.02em; }
  .hint { color: var(--muted); font-size: 14px; margin: 6px 0 0; }

  /* 스튜디오 목록 */
  .studios { display: grid; grid-template-columns: 1fr; gap: 0; border-top: 1px solid var(--line); }
  @media (min-width: 640px) { .studios { grid-template-columns: 1fr 1fr; column-gap: 20px; border-top: 0; } }
  .studio { position: relative; display: grid; grid-template-columns: 52px 1fr; gap: 2px 12px; padding: 14px 12px 14px 14px;
    border-bottom: 1px solid var(--line); cursor: pointer; background: transparent; text-align: left; border-left: 4px solid transparent; }
  .studio:hover { background: var(--paper); }
  .studio input { position: absolute; opacity: 0; pointer-events: none; }
  .studio .code { grid-row: span 2; font-weight: 800; font-size: 13px; color: var(--muted); padding-top: 3px; font-variant-numeric: tabular-nums; }
  .studio .loc { font-weight: 750; font-size: 16.5px; }
  .studio .meta { font-size: 13.5px; color: var(--muted); }
  .studio:has(input:checked) { background: var(--paper); border-left-color: var(--accent); }
  .studio:has(input:checked) .code { color: var(--accent); }
  .studio:has(input:focus-visible) { outline: 3px solid var(--accent); outline-offset: -3px; }

  /* 입력 */
  .field { display: block; margin: 0 0 14px; }
  .field > span { display: block; font-weight: 650; font-size: 14.5px; margin-bottom: 6px; }
  .field .req { color: var(--danger); margin-left: 2px; }
  input[type=text], input[type=date], input[type=email], select, textarea {
    width: 100%; padding: 12px 12px; border: 1px solid var(--line); border-radius: var(--radius); background: var(--paper);
    min-height: 48px; font-size: 16px; }
  input[readonly] { background: transparent; color: var(--muted); }
  .row2 { display: grid; grid-template-columns: 1fr; gap: 0 14px; }
  @media (min-width: 560px) { .row2 { grid-template-columns: 1fr 1fr; } }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; }
  .chip { position: relative; }
  .chip input { position: absolute; opacity: 0; }
  .chip span { display: inline-block; padding: 9px 14px; border: 1px solid var(--line); border-radius: 999px; background: var(--paper);
    cursor: pointer; font-size: 15px; }
  .chip input:checked + span { border-color: var(--ink); background: var(--ink); color: var(--paper); }
  .chip input:focus-visible + span { outline: 3px solid var(--accent); outline-offset: 2px; }
  .check { display: flex; gap: 10px; align-items: flex-start; padding: 12px 0; cursor: pointer; }
  .check input { width: 22px; height: 22px; margin: 2px 0 0; accent-color: var(--accent); flex: none; }
  .check b { font-weight: 700; }
  details { border-left: 2px solid var(--line); margin: 0 0 6px 32px; padding: 2px 0 2px 12px; font-size: 14px; color: var(--muted); }
  details summary { cursor: pointer; color: var(--ink); font-weight: 600; }
  details table { border-collapse: collapse; margin: 8px 0; width: 100%; }
  details th, details td { text-align: left; padding: 6px 8px; border-bottom: 1px solid var(--line); vertical-align: top; }
  details th { width: 30%; white-space: nowrap; font-weight: 650; color: var(--ink); }
  details ol { padding-left: 18px; margin: 8px 0; }

  /* 지원 토글 */
  .support { display: flex; gap: 12px; align-items: flex-start; padding: 14px; border: 1px solid var(--line); border-radius: var(--radius);
    background: var(--paper); margin-bottom: 14px; cursor: pointer; }
  .support input { width: 22px; height: 22px; accent-color: var(--accent); margin-top: 2px; flex: none; }

  /* 시간표 */
  .legend { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: 13px; color: var(--muted); margin: 10px 0; }
  .legend i { display: inline-block; width: 14px; height: 14px; border-radius: 3px; vertical-align: -2px; margin-right: 5px; border: 1px solid var(--line); }
  .slots { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
  @media (min-width: 560px) { .slots { grid-template-columns: repeat(6, 1fr); } }
  .slot { min-height: 46px; border: 1px solid var(--line); background: var(--paper); border-radius: var(--radius); cursor: pointer;
    font-variant-numeric: tabular-nums; font-weight: 650; font-size: 15px; padding: 4px; line-height: 1.15; }
  .slot small { display: block; font-size: 11px; font-weight: 500; color: var(--muted); }
  .slot:hover:not(:disabled) { border-color: var(--ink); }
  .slot:disabled { cursor: not-allowed; color: #8d8a82; background: var(--busy);
    background-image: repeating-linear-gradient(135deg, transparent 0 6px, rgba(0,0,0,.05) 6px 12px); }
  .slot.pending:disabled { background-color: var(--pending-soft); color: var(--pending); }
  .slot.mine:disabled { background: var(--accent-soft); color: var(--accent); background-image: none; }
  .slot.sel { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
  .slot.sel small { color: var(--accent-ink); }
  .slot.in { background: var(--accent-soft); border-color: var(--accent); }
  .usage { margin-top: 12px; font-size: 14px; color: var(--muted); }
  .bar { height: 6px; background: var(--busy); border-radius: 999px; overflow: hidden; margin-top: 6px; }
  .bar > i { display: block; height: 100%; background: var(--accent); }

  /* 하단 고정 요약 */
  .dock { position: fixed; left: 0; right: 0; bottom: 0; background: var(--ink); color: var(--paper); z-index: 10;
    padding: 12px 16px calc(12px + env(safe-area-inset-bottom)); }
  .dock .in { max-width: 760px; margin: 0 auto; display: flex; gap: 12px; align-items: center; justify-content: space-between; }
  .dock .sum { font-size: 14px; line-height: 1.4; }
  .dock .sum b { display: block; font-size: 16px; }
  .btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; min-height: 48px; padding: 0 20px;
    border-radius: var(--radius); border: 1px solid var(--ink); background: var(--paper); color: var(--ink); font-weight: 750;
    cursor: pointer; text-decoration: none; white-space: nowrap; font-size: 15.5px; }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
  .dock .btn.primary { border-color: var(--accent); }
  .btn.danger { color: var(--danger); border-color: var(--danger); background: transparent; }
  .btn.small { min-height: 38px; padding: 0 12px; font-size: 14px; }
  .btn:disabled { opacity: .45; cursor: not-allowed; }

  /* 알림 */
  .note { padding: 12px 14px; border-radius: var(--radius); margin: 14px 0; font-size: 14.5px; border: 1px solid; }
  .note.info { background: var(--paper); border-color: var(--line); }
  .note.warn { background: var(--pending-soft); border-color: #e9c98b; color: #5a3700; }
  .note.err { background: var(--danger-soft); border-color: #eab3ab; color: #6e170f; white-space: pre-line; }
  .note.ok { background: var(--accent-soft); border-color: #a9d6c2; color: #063f2c; }

  /* 카드 */
  .card { background: var(--paper); border: 1px solid var(--line); border-radius: var(--radius); padding: 16px; margin: 12px 0; }
  .card h3 { font-size: 1.05rem; font-weight: 800; }
  .card .when { font-size: 1.15rem; font-weight: 800; letter-spacing: -0.01em; font-variant-numeric: tabular-nums; }
  .card dl { display: grid; grid-template-columns: max-content 1fr; gap: 4px 14px; margin: 10px 0 0; font-size: 14.5px; }
  .card dt { color: var(--muted); }
  .card dd { margin: 0; }
  .card .actions { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 14px; }
  .pill { display: inline-block; padding: 2px 10px; border-radius: 999px; font-size: 12.5px; font-weight: 700; border: 1px solid; vertical-align: 2px; }
  .pill.확정, .pill.체크인 { color: var(--accent); border-color: var(--accent); background: var(--accent-soft); }
  .pill.담당자 { color: var(--pending); border-color: #e0b56a; background: var(--pending-soft); }
  .pill.노쇼 { color: var(--danger); border-color: #e3a49b; background: var(--danger-soft); }
  .pill.muted { color: var(--muted); border-color: var(--line); background: transparent; }
  .pill.sel { color: #3a2a7a; border-color: #b9aee6; background: #ece8fb; }

  .center { text-align: center; }
  .big-status { font-size: clamp(1.6rem, 7vw, 2.2rem); font-weight: 850; letter-spacing: -0.03em; margin: 18px 0 6px; }
  .loading { padding: 40px 0; color: var(--muted); }
  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
  .empty { padding: 26px 0; color: var(--muted); }

  /* 표(담당자) */
  .tbl-wrap { overflow-x: auto; border: 1px solid var(--line); border-radius: var(--radius); background: var(--paper); }
  table.tbl { border-collapse: collapse; width: 100%; font-size: 14px; }
  .tbl th, .tbl td { padding: 9px 10px; border-bottom: 1px solid var(--line); text-align: left; vertical-align: top; white-space: nowrap; }
  .tbl th { background: #eeebe3; font-weight: 700; position: sticky; top: 0; }
  .tbl td.wrapcell { white-space: normal; min-width: 160px; }
  .tbl td .btn { margin: 0 4px 4px 0; }
  .num { text-align: right; font-variant-numeric: tabular-nums; }

  dialog { border: 1px solid var(--ink); border-radius: var(--radius); padding: 20px; max-width: 460px; width: calc(100% - 32px); background: var(--paper); }
  dialog::backdrop { background: rgba(23,25,30,.45); }
  dialog h3 { font-size: 1.15rem; margin-bottom: 12px; }
  .dlg-actions { display: flex; gap: 8px; justify-content: flex-end; margin-top: 8px; }

  .toast { position: fixed; left: 50%; bottom: 96px; transform: translateX(-50%); background: var(--ink); color: var(--paper);
    padding: 10px 16px; border-radius: var(--radius); font-size: 14.5px; z-index: 50; max-width: calc(100% - 32px); }

  @media (prefers-reduced-motion: no-preference) {
    .step, .card { animation: rise .35s ease-out both; }
    @keyframes rise { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
  }
  @media print {
    body { background: #fff; }
    .no-print, .top, .tabs { display: none !important; }
  }
</style>
